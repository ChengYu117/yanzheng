[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-re-dataset-model-base"
version = "0.2.0"
description = "MISC SAE interpretability pipeline: analyze counseling behavior labels through Llama hidden states and Sparse Autoencoder latents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "safetensors",
  "sentencepiece",
  "torch",
  "transformers",
  "accelerate",
  "scipy",
  "scikit-learn",
  "huggingface-hub",
  "datasets",
  "tqdm",
  "pandas",
  "matplotlib",
  "zstandard",
  "fastapi",
  "uvicorn[standard]",
  "lm-saes; python_version >= '3.11'",
  "transformer-lens; python_version >= '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
